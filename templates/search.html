<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ USERNAME }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- I hate having to use url_for it just slightly confuses me -->
</head>
<body>
    <nav> 
        <img src="{{ url_for('static', filename='images/crown_logo.png') }}" alt="Crown Logo">
        <a href="{{ url_for('home') }}">
            <h2> Crown Jewels </h2>
        </a>
        <div class = "navbar_links">
            <div class="dropdown_menu">
                <a href="{{ url_for('shop') }}"> Shop <span class="dropdown">⏷</span> </a>
                <ul class="shop_dropdown">
                    <li>Test-1</li>
                    <li>Test-2</li>
                </ul>
            </div>
        </div>
        <div class="cart">
            <div class="search_bar">
                <form action="{{ url_for('search') }}" method="post">
                    <input type="text" name="SEARCH_BOX" placeholder="Search...">
                    <button type="submit">Search</button>
                </form>
            </div>
            <div class="cart_button">
                <a href=""> <img src="{{ url_for('static', filename='images/card.png') }}" alt="Shopping Cart Icon"> </a> <!-- all variables set by flask have to be wrapped inside those brackets I guess -->
            </div>
        </div>
    </nav>
    <div name="main">
        <h1 class="product_query"> Showing Results For "{{SEARCH_QUERY}}" </h1>
        <div class="product_images">
            {% for p in PRODUCTS %}
                <div class="product_image">
                    <p>{{ p.name }}</p>
                    <p>{{ p.price }}</p>
                    <a href="google.com"> <img src="{{ url_for('static', filename='images/products/' + p.image) }}"> </a>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
