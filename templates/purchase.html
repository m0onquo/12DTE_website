<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ USERNAME }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- I hate having to use url_for it just slightly confuses me -->
</head>
<body>
    <nav class="nav_main"> 
        <img src="{{ url_for('static', filename='images/crown_logo.png') }}" alt="Crown Logo">
        <a href="{{ url_for('home') }}">
            <h2> Crown Jewels </h2>
        </a>
        <div class = "navbar_links">
            <div class="dropdown_menu">
                <a href="{{ url_for('shop', SORT='NONE') }}"> Shop <span class="dropdown">⏷</span> </a>
                <ul class="shop_dropdown">
                    {% for p in globalProducts %}
                    <a href = "/product/{{ p.id }}">
                        <li>
                            {{ p.name }}    
                        </li>
                    </a>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <div class="cart">
            <div class="search_bar">
                <form action="{{ url_for('search') }}" method="post">
                    <input type="text" name="SEARCH_BOX" placeholder="Search...">
                    <button type="submit"><img src="{{ url_for('static', filename='images/search_icon.png') }}"></button>
                </form>
            </div>
            <div class="cart_button">
                <a href="{{url_for('view_cart')}}"> <img src="{{ url_for('static', filename='images/card.png') }}" alt="Shopping Cart Icon"> </a> <!-- all variables set by flask have to be wrapped inside those brackets I guess -->
            </div>
        </div>
    </nav>
    <nav class="nav_bottom"> some text thingy placeholder </nav>
    <div name="main" class="checkout_container">
    <div class="checkout_div">
        <h2>Secure Checkout</h2>
        
        <form action="#" method="POST" onsubmit="purchase()">
            <h3> Shipping </h3>
            <input type="text" placeholder="Full Name" required>
            <input type="text" placeholder="Street Address" required>
            
            <div class="input_div">
                <input type="text" placeholder="City" required>
                <input type="text" placeholder="Postcode" required style="width: 120px;">
            </div>
        
            <h3> Payment </h3>
            <input type="text" placeholder="Cardholder Name" required>
            <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required>
            
            <div class="input_div">
                <input type="text" placeholder="MM/YY" maxlength="5" required>
                <input type="password" placeholder="CVV" maxlength="3" required style="width: 80px;">
            </div>
        
            <button type="submit" class="payButton"> [ AUTHORIZE TRANSACTION ] </button>
            <script>
                function purchase() {
                    event.preventDefault(); // THis is to stop it from redirecting after clicking
                    window.alert("Purchased Successfully!");
                }
            </script>
            
        </form>
    </div>
</div>
</body>
</html>
