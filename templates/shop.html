<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ USERNAME }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- I hate having to use url_for it just slightly confuses me -->
</head>
<body>
    <nav class="nav_main">
        <img src="{{ url_for('static', filename='images/crown_logo.png') }}" alt="Crown Logo">
        <a href="{{ url_for('home') }}">
            <h2> Crown Jewels </h2>
        </a>
        <div class = "navbar_links">
            <div class="dropdown_menu">
                <a href="#"> Shop <span class="dropdown">⏷</span> </a>
                <ul class="shop_dropdown">
                    {% for p in globalProducts %}
                    <a href = "/product/{{ p.id }}">
                        <li>
                            {{ p.name }}    
                        </li>
                    </a>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <div class="cart">
            <div class="search_bar">
                <form action="{{ url_for('search') }}" method="post">
                    <input type="text" name="SEARCH_BOX" placeholder="Search...">
                    <button type="submit"><img src="{{ url_for('static', filename='images/search_icon.png') }}"></button>
                </form>
            </div>
            <div class="cart_button">
                <a href="{{url_for('view_cart')}}"> <img src="{{ url_for('static', filename='images/card.png') }}" alt="Shopping Cart Icon"> </a> <!-- all variables set by flask have to be wrapped inside those brackets I guess -->
            </div>
        </div>
    </nav>
    <div name="main">
        <div class="product_sorting">
            <h3> Sort By: </h3>
            <div class="filter_options">
                <a href="{{ url_for('shop', SORT='name') }}"> Name </a>
                <a href="{{ url_for('shop', SORT='price') }}"> Price </a>
                <a href="{{ url_for('shop', SORT='id') }}"> ID </a>
            </div>
        </div>
        <div class="product_images">
            {% for p in globalProducts %}
            <div class="product">
                <a href = "/product/{{ p.id }}">
                    <div class="product_image">
                        <img src="{{ url_for('static', filename='images/products/' + p.image) }}">
                    </div>
                    <div class="product_info" > 
                        <p>{{ p.name }}</p>
                        <p>${{ p.price }}</p> 
                    </div>
                </a>
                <a href="{{ url_for('add_cart', item_id=p.id) }}"> <button>[ Add To Cart ]</button> </a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
